# DeltaSleuth on one host: PostgreSQL plus the app (API, UI and worker in one process), and before each
# start of the app the one-shot migrate service, which keeps the database's roles apart.
# Never edit this file, which an upgrade replaces: this installation's changes go in
# docker-compose.site.yml, which .env names after it. From the installation's folder (docs/deployment.md
# walks through every step):
#   docker compose up -d
# Settings: deploy/config/*.yaml (from the *.example.yaml files). Secrets: deploy/secrets/, one file each.
# Shared deployments use a TLS reverse proxy on the host. A local installation opens http://localhost:8000.
# A checkout has no release image to load: its .env names the source override too (deploy/env.source.example).
# After changing the site file, `docker compose up -d` applies it (`restart` does not).

name: deltasleuth

x-release: &release                    # the signed release: `docker load` puts it here
  image: deltasleuth:0.1.0.dev0        # always pyproject's version; source builds: docker-compose.source.yml
  pull_policy: never
  read_only: true                      # the app writes only to its volumes and /tmp
  tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    # Errors log no row values. Memory for a host of 4 GB or more beside the app: an eighth of it for the
    # buffers, and the work memory one sort or hash of a connection may take (the app holds about ten).
    command: [postgres, -c, log_error_verbosity=terse, -c, shared_buffers=512MB, -c, work_mem=32MB]
    shm_size: 256m                             # a parallel hash's shared memory: Docker's 64 MB is too little
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    environment:
      POSTGRES_USER: deltasleuth
      POSTGRES_DB: deltasleuth
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]                     # the superuser's: the image needs one, the app never uses it
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, deltasleuth, -d, deltasleuth]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:                                     # ds db setup, run to its end before the app starts
    <<: *release
    depends_on:
      db: {condition: service_healthy}
    # The superuser makes the schema owner's role and the app's own role, each with its address's password,
    # and hands schema ds to the owner; the owner migrates and grants the app's role data rights alone, so
    # whoever holds db_dsn cannot switch the audit log's triggers off. `docker compose run --rm migrate
    # --roles-only` makes the roles alone, before a restore loads the schema.
    entrypoint: [ds, db, setup, --superuser, deltasleuth,
                 --superuser-password-ref, "file:/run/secrets/db_password"]
    volumes: ["./config:/etc/deltasleuth:ro"]
    secrets: [db_password, db_owner_dsn, db_dsn]   # db_dsn: the app role's password, which it sets
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    healthcheck: {disable: true}               # the image's check probes the API port

  app:
    <<: *release
    hostname: deltasleuth-app                  # stable, so CLI audit rows read local:<DS_OPERATOR>@deltasleuth-app
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]             # loopback only; shared deployments use a TLS reverse proxy
    extra_hosts: ["host.docker.internal:host-gateway"]   # an app on this machine: Linux needs the line
    volumes:
      - ./config:/etc/deltasleuth:ro
      - evidence:/var/lib/deltasleuth/evidence
      - workspace:/var/lib/deltasleuth/workspace
      - p0:/var/lib/deltasleuth/p0             # samples, specs and P0 sheets for `docker compose run app ds ...`
    secrets: [db_dsn, kek, tokeniser]          # the site file adds the IdP credential and llm_key
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}   # audit rows and access lines
    stop_grace_period: 40s                     # to close the notifier and file reads and hand back leases
    restart: unless-stopped

networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24, gateway: 172.30.0.1}]   # pinned: auth.trusted_proxies names the gateway

volumes:
  pgdata:
  evidence:
  workspace:
  p0:

secrets:
  db_password: {file: ./secrets/db_password}
  db_owner_dsn: {file: ./secrets/db_owner_dsn}
  db_dsn: {file: ./secrets/db_dsn}
  kek: {file: ./secrets/kek}                   # the keyring and tokeniser key: never in a volume or backup
  tokeniser: {file: ./secrets/tokeniser}
