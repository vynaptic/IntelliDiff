# Two public, keyless deployments of the Star Wars API. Each target declares only what can be
# observed from outside: where it lives, how politely to call it, and what its "not found" looks like.

targets:
  swapi-dev:
    base_url: https://swapi.dev/api
    auth: {kind: none}
    rate_per_s: 3                              # a free public service: stay well below any limit
    max_concurrency: 1
    capabilities:
      authoritative_absence:
        status: [404]
        shapes: [not_found_body]               # a 404 with another body (a proxy page) is unconfirmed
      absence_shapes:
        not_found_body: 'has(body.detail) && body.detail == "Not found."'

  swapi-tech:
    base_url: https://www.swapi.tech/api
    auth: {kind: none}
    rate_per_s: 3
    max_concurrency: 1
    capabilities:
      authoritative_absence:
        status: [404]
        shapes: [not_found_body]
      absence_shapes:
        not_found_body: 'has(body.message) && body.message == "not found"'
