# The files acceptance kit: accounts_a/accounts.csv against accounts_b/accounts.parquet, the two exports
# of generate.py. Target: targets.yaml. Expected result: expected.json. Contract: docs/mvp/FILES.md.
#
# Side a is CSV: every field is text until this spec declares otherwise. Its zero-padded key reads as an
# integer (csv.keys), its decimal comma and its DD/MM/YYYY dates through the typeMap; side b's Parquet
# columns carry their own types. A CSV field and a Parquet column are never declared alike, so the worker
# hashes every compared column, as it does across two database engines.

apiVersion: deltasleuth/v1
kind: ComparisonSpec

metadata:
  name: acceptance-kit-files
  version: "1.0.0"
  owner: examples
  description: The files acceptance kit's two exports, a declared CSV dialect against Parquet.

normalizerVersion: "1.1.0"

key:
  name: account_id
  type: string
  class: business_code                         # synthetic numbers: shown in clear, to match expected.json

sides:
  a:
    role: legacy
    target: kit-files
    table:
      name: accounts_a
      keyColumns: [account_id]
      file:
        path: accounts_a/accounts.csv
        format: csv
        asOfFile: _AS_OF                       # the export's stamp file, written last
        csv:
          columns: [account_id, holder, balance, opened, status]
          keys: {account_id: {as: integer}}    # 000005 is the key 5
          delimiter: ";"
          header: true
    typeMap:
      balance: {as: decimal, decimalSeparator: ","}
      opened: {as: date, format: "%d/%m/%Y"}
  b:
    role: new
    target: kit-files
    table:
      name: accounts_b
      keyColumns: [account_id]
      file: {path: accounts_b/, format: parquet}

compare: {}

recheck:
  delay: 0s
  times: 1
  outcomes: [MISMATCH, NOT_FOUND_A, NOT_FOUND_B]

execution:
  concurrency: 2

security:
  unlisted: tokenize
