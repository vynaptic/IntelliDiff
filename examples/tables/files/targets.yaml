# The directory generate.py wrote, declared as a files target. Both sides of spec.yaml read it. The root
# is the directory's real path, under the settings' files.roots_under (default /var/lib/deltasleuth/files).

targets:
  kit-files:
    engine: files
    root: /var/lib/deltasleuth/files/kit
    settle_s: 0             # the kit's files were just written; a real export keeps the default, 60
    allow_writable: true    # you wrote this directory; a real export is mounted read-only (:ro)
