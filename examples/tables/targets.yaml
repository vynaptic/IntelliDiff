# The two demo databases of seed.sql. A database target holds only a DSN reference and its budget.
# Each DSN is a one-line file: a libpq keyword string or a postgresql:// URI. A relative reference
# resolves against this file, and secrets/ is git-ignored. In a deployment, write
# file:/run/secrets/<name> instead.

targets:
  crm-legacy:
    dsn_ref: file:secrets/crm_legacy_dsn
    rate_per_s: 50                             # per-key reads; a scan is one query per side
    max_concurrency: 2

  platform-users:
    dsn_ref: file:secrets/platform_users_dsn
    rate_per_s: 50
    max_concurrency: 2
